name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref}}
  cancel-in-progress: true

env:
  CI: true
  DATABASE_URL: postgresql://cascade:cascade@localhost:5432/cascade
  QUEUE_REDIS_URL: redis://localhost:6379
  API_KEY_PEPPER: ci-api-key-pepper
  CASCADE_API_URL: http://localhost:3001

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cascade
          POSTGRES_PASSWORD: cascade
          POSTGRES_DB: cascade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cascade -d cascade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint:ci

      - name: Typecheck
        run: pnpm run check-types

      - name: Check unused code and dependencies
        run: pnpm run knip:prod

      - name: Validate database schema
        run: pnpm run db:validate

      - name: Verify generated Prisma client
        run: pnpm run db:generate:check

      - name: Apply database migrations
        run: pnpm run db:deploy

      - name: Unit tests
        run: pnpm run test:unit

      - name: Render Helm chart
        run: pnpm run hosting:template

      - name: Install Playwright browser
        run: pnpm --filter @cascade/e2e exec playwright install chromium --with-deps

      - name: Write CI env file
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "QUEUE_REDIS_URL=$QUEUE_REDIS_URL"
            echo "API_KEY_PEPPER=$API_KEY_PEPPER"
          } > .env

      - name: Run E2E
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: pnpm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          if-no-files-found: ignore
