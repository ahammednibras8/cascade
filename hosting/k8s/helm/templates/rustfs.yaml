{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cascade.fullname" . }}-rustfs
  labels:
    {{- include "cascade.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  type: ClusterIP
  selector:
    {{- include "cascade.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cascade.fullname" . }}-rustfs
  labels:
    {{- include "cascade.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  serviceName: {{ include "cascade.fullname" . }}-rustfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "cascade.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        {{- include "cascade.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: volume-permissions
          image: alpine:3.20
          command:
            - sh
            - -ec
            - chown -R 10001:10001 /data /logs
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      containers:
        - name: rustfs
          image: "{{ .Values.rustfs.image.repository }}:{{ .Values.rustfs.image.tag }}"
          imagePullPolicy: {{ .Values.rustfs.image.pullPolicy }}
          args:
            - /data
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cascade.rustfsSecretName" . }}
                  key: {{ .Values.rustfs.auth.accessKeyKey }}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cascade.rustfsSecretName" . }}
                  key: {{ .Values.rustfs.auth.secretKeyKey }}
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_REGION
              value: {{ .Values.rustfs.region | quote }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/ready
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.rustfs.persistence.storageClass }}
        storageClassName: {{ .Values.rustfs.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rustfs.persistence.dataSize }}
    - metadata:
        name: logs
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.rustfs.persistence.storageClass }}
        storageClassName: {{ .Values.rustfs.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rustfs.persistence.logsSize }}
{{- end }}
