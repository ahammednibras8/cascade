{{- if .Values.workers.local.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cascade.fullname" . }}-worker-local
  labels:
    {{- include "cascade.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-local
spec:
  replicas: {{ .Values.workers.local.replicaCount }}
  selector:
    matchLabels:
      {{- include "cascade.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-local
  template:
    metadata:
      labels:
        {{- include "cascade.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-local
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: "{{ .Values.workers.image.repository }}:{{ required "workers.image.tag is required" .Values.workers.image.tag }}"
          imagePullPolicy: {{ .Values.workers.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "cascade.runtimeSecretName" . }}
          env:
            - name: NODE_ENV
              value: production
            - name: CASCADE_WORKER_ROLE
              value: local
            - name: CASCADE_DEPLOYMENT_ID
              value: local
            - name: CASCADE_TASK_MODULE
              value: file:///app/packages/worker/dist/tasks/local.js
            - name: WORKER_CONCURRENCY
              value: {{ .Values.workers.local.concurrency | quote }}
          resources:
            {{- toYaml .Values.workers.local.resources | nindent 12 }}
{{- end }}
{{- if .Values.workers.control.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cascade.fullname" . }}-worker-control
  labels:
    {{- include "cascade.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-control
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cascade.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-control
  template:
    metadata:
      labels:
        {{- include "cascade.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-control
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: "{{ .Values.workers.image.repository }}:{{ required "workers.image.tag is required" .Values.workers.image.tag }}"
          imagePullPolicy: {{ .Values.workers.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "cascade.runtimeSecretName" . }}
          env:
            - name: NODE_ENV
              value: production
            - name: CASCADE_WORKER_ROLE
              value: control
          resources:
            {{- toYaml .Values.workers.control.resources | nindent 12 }}
{{- end }}
