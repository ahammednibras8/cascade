name: cascade

services:
  postgres:
    image: postgres:17-alpine
    container_name: cascade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cascade}
      POSTGRES_USER: ${POSTGRES_USER:-cascade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cascade}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - cascade_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cascade} -d ${POSTGRES_DB:-cascade}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cascade-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - cascade_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles:
      - app
    image: cascade-api:local
    container_name: cascade-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cascade}:${POSTGRES_PASSWORD:-cascade}@postgres:5432/${POSTGRES_DB:-cascade}
    working_dir: /app/packages/database
    command:
      - ./node_modules/.bin/prisma
      - migrate
      - deploy
    restart: "no"

  api:
    profiles:
      - app
    image: cascade-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: cascade-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-cascade}:${POSTGRES_PASSWORD:-cascade}@postgres:5432/${POSTGRES_DB:-cascade}
      QUEUE_REDIS_URL: redis://redis:6379
      API_KEY_PEPPER: ${API_KEY_PEPPER:-secret}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${RUSTFS_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-cascade}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-cascade-password}
      S3_BUCKET: ${S3_BUCKET:-cascade-task-payloads}
      S3_FORCE_PATH_STYLE: "true"
      LARGE_PAYLOAD_THRESHOLD_BYTES: ${LARGE_PAYLOAD_THRESHOLD_BYTES:-262144}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20

  dashboard:
    profiles:
      - app
    image: cascade-dashboard:local
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    container_name: cascade-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CASCADE_API_URL: http://api:3001
      CASCADE_DASHBOARD_API_KEY: ${CASCADE_DASHBOARD_API_KEY}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    profiles:
      - app
    image: cascade-worker:local
    build:
      context: ..
      dockerfile: packages/worker/Dockerfile
    container_name: cascade-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cascade}:${POSTGRES_PASSWORD:-cascade}@postgres:5432/${POSTGRES_DB:-cascade}
      QUEUE_REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      CASCADE_DEPLOYMENT_ID: ${CASCADE_DEPLOYMENT_ID:-local}
      CASCADE_TASK_MODULE: ./tasks/local.js
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${RUSTFS_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-cascade}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-cascade-password}
      S3_BUCKET: ${S3_BUCKET:-cascade-task-payloads}
      S3_FORCE_PATH_STYLE: "true"
      LARGE_PAYLOAD_THRESHOLD_BYTES: ${LARGE_PAYLOAD_THRESHOLD_BYTES:-262144}

  deployment-runner:
    profiles:
      - app
    image: cascade-deployment-runner:local
    build:
      context: ..
      dockerfile: apps/deployment-runner/Dockerfile
    container_name: cascade-deployment-runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cascade}:${POSTGRES_PASSWORD:-cascade}@postgres:5432/${POSTGRES_DB:-cascade}
      DEPLOYMENT_DATABASE_URL: postgresql://${POSTGRES_USER:-cascade}:${POSTGRES_PASSWORD:-cascade}@postgres:5432/${POSTGRES_DB:-cascade}
      DEPLOYMENT_QUEUE_REDIS_URL: redis://redis:6379
      DEPLOYMENT_DOCKER_NETWORK: cascade_default
      DEPLOYMENT_WORKER_CONCURRENCY: ${DEPLOYMENT_WORKER_CONCURRENCY:-2}
      DEPLOYMENT_RUNNER_POLL_MS: ${DEPLOYMENT_RUNNER_POLL_MS:-5000}
      DEPLOYMENT_PULL_IMAGES: "false"
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${RUSTFS_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-cascade}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-cascade-password}
      S3_BUCKET: ${S3_BUCKET:-cascade-task-payloads}
      S3_FORCE_PATH_STYLE: "true"
      LARGE_PAYLOAD_THRESHOLD_BYTES: ${LARGE_PAYLOAD_THRESHOLD_BYTES:-262144}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  clickhouse:
    profiles:
      - analytics
    image: clickhouse/clickhouse-server:25.11-alpine
    container_name: cascade-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-cascade}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cascade}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cascade}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - cascade_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs-volume-init:
    profiles:
      - storage
    image: alpine:3.20
    container_name: cascade-rustfs-volume-init
    command: ["sh", "-c", "chown -R 10001:10001 /data /logs"]
    volumes:
      - cascade_rustfs_data:/data
      - cascade_rustfs_logs:/logs

  rustfs:
    profiles:
      - storage
    image: rustfs/rustfs:latest
    container_name: cascade-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-volume-init:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cascade}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cascade-password}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
    ports:
      - "${RUSTFS_API_PORT:-19090}:9000"
      - "${RUSTFS_CONSOLE_PORT:-19091}:9001"
    volumes:
      - cascade_rustfs_data:/data
      - cascade_rustfs_logs:/logs
    command: ["/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:9000/health/ready || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cascade_postgres_data:
  cascade_redis_data:
  cascade_clickhouse_data:
  cascade_rustfs_data:
  cascade_rustfs_logs:
